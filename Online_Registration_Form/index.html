<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>
    <h2>Student Registration Form</h2>
    <form action="#" method="post" enctype="multipart/form-data"> <label>Full Name:</label> <input type="text"
            name="name" required> <br><br> <label>Email:</label> <input type="email" name="email" required> <br><br>
        <label>Password:</label> <input type="password" name="password" required> <br><br> <label>Gender:</label> <input
            type="radio" name="gender" value="Male"> Male <input type="radio" name="gender" value="Female"> Female
        <br><br> <label>Course:</label> <select name="course">
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Com</option>
            <option>BA</option>
        </select> <br><br> <label>Date of Birth:</label> <input type="date" name="dob"> <br><br> <label>Hobbies:</label>
        <input type="checkbox" name="hobby" value="Reading"> Reading <input type="checkbox" name="hobby" value="Sports">
        Sports <input type="checkbox" name="hobby" value="Coding"> Coding <br><br> <label>Address:</label><br> <textarea
            name="address" rows="4" cols="30"></textarea> <br><br> <label>Upload Photo:</label> <input type="file"
            name="photo" accept="image/*"> <br><br> <input type="submit" value="Register"> <input type="reset"
            value="Reset"> </form>
</body>

</html>

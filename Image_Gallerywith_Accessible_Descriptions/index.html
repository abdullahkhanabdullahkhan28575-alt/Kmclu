<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Gallery</title>
</head>
<body>
  <section>
    <h2>College Event Gallery</h2>
    <figure>
      <img src="inauguration.jpg"
      alt="Students attending the college event inauguration"
      width="300">
      <figcaption>Opening ceremony of the college event.</figcaption>
    </figure>
    <figure>
      <img src="workshop.jpg"
      alt="Students participating in a web development workshop"
      width="300">
      <figcaption>Students during the web development workshop.</figcaption>
    </figure>
    <figure>
      <img src="cultural.jpg"
      alt="Students presenting a cultural performance"
      width="300">
      <figcaption>Cultural programme during the event.</figcaption>
    </figure>
  </section>
</body>
</html>
